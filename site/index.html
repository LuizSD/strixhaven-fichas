<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://apis.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: http://localhost:* http://127.0.0.1:*; connect-src 'self' https://*.googleapis.com https://firestore.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com https://www.gstatic.com; font-src 'self'; frame-src https://accounts.google.com https://*.firebaseapp.com; object-src 'none'; base-uri 'self';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#152b43">
  <title>Strixhaven — Fichas de estudantes · D&D 2024</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="img/strixhaven.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/strixhaven-192.png">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/strixhaven.css">
  <link rel="stylesheet" href="css/magias-catalogo.css">
  <link rel="stylesheet" href="css/ajustes-finais.css">
</head>
<body>

  <!-- Barra de navegação superior -->
  <header id="app-header">
    <button id="btn-voltar" class="header-btn" style="display:none">
      <svg id="icone-voltar" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h1 id="header-titulo">Strixhaven <span class="header-versao"></span></h1>
    <!-- Número da build do GitHub Actions. Fica oculto e serve só para
         diagnóstico (aparece no rodapé das notas de versão). O selo visível
         do header é a versão MANUAL, definida em js/versao.js. -->
    <span id="build-numero" hidden>v0</span><!-- VERSION_AUTO -->
    <div id="header-acoes"></div>
    <!-- Separador visual entre o bloco de notas de versão (#header-acoes) e
         o bloco de reportar bug: sem ele os dois grudam e o emoji de um
         parece pertencer ao outro (ver app.css). Some sozinho quando
         #header-acoes está vazio, via CSS. -->
    <span class="header-separador no-print" aria-hidden="true"></span>
    <nav id="magias-nav" class="no-print" aria-label="Catálogo de magias"><a id="menu-todas-magias" href="#magias"><span>Todas as Magias</span><small lang="en">All Spells</small></a></nav>
    <span id="label-reportar-bug" class="header-rotulo no-print">Reportar Bugs</span>
    <button id="btn-reportar-bug" class="header-btn no-print" title="Reportar problema ou sugestão" aria-label="Reportar Bugs">🐛</button>
  </header>

  <!-- Conteúdo principal (gerenciado pelo router) -->
  <main id="app-content"></main>
  <footer class="sh-creditos no-print">Strixhaven · adaptação de campanha sobre D&amp;D 2024.<br>Base: <a href="https://github.com/ZaitBr-bit/D-D_2024" target="_blank" rel="noopener noreferrer">ZaitBr — D-D_2024</a> · <a href="../LICENSE">Código MIT</a>. Conteúdo de jogo pertence aos respectivos titulares.</footer>

  <!-- Modal reutilizável -->
  <div id="modal-overlay" class="modal-overlay" style="display:none">
    <div id="modal-container" class="modal-container">
      <div id="modal-header" class="modal-header">
        <h2 id="modal-titulo"></h2>
        <button class="modal-fechar" onclick="fecharModal()">&times;</button>
      </div>
      <div id="modal-corpo" class="modal-corpo"></div>
      <div id="modal-acoes" class="modal-acoes"></div>
    </div>
  </div>

  <!-- Toast de notificação -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Scripts como módulos ES -->
  <script type="module" src="js/app.js"></script>

</body>
</html>
